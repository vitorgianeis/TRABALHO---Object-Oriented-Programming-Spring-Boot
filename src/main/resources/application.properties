# ===== Nome da aplicação =====
spring.application.name=sistema

# ===== Conexão com MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_automotivo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# create: apaga e recria as tabelas toda vez que iniciar (ótimo para testar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Execução do data.sql =====
# Faz o Spring esperar o Hibernate criar as tabelas antes de rodar os INSERTs
spring.jpa.defer-datasource-initialization=true
# Garante que o Spring rode o data.sql no MySQL
spring.sql.init.mode=always